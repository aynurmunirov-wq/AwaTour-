<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWA TOUR — наличие мест (демо)</title><style>
:root{font-family:system-ui,-apple-system,Arial;background:#f3f7f6;color:#123b3c}*{box-sizing:border-box}body{margin:0}header{background:#07575b;color:white;padding:19px 16px}header h1{margin:0;font-size:25px;letter-spacing:1px}header small{color:#c4e8e3}main{max-width:780px;margin:auto;padding:16px}.notice{background:#fff4dc;padding:12px;border-radius:12px;font-size:13px;margin-bottom:15px}.controls{display:grid;gap:10px;grid-template-columns:1fr 1fr}select,input,button{font:inherit;border:1px solid #c5d7d3;border-radius:10px;padding:12px;min-width:0;background:white}button{background:#08777a;color:white;border:0;cursor:pointer;font-weight:650}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs button.off{background:#dfeae7;color:#235454}.wide{grid-column:1/-1}.entry{background:white;border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0c44441a;display:flex;justify-content:space-between;align-items:center;gap:12px}.entry strong{font-size:15px}.entry small{display:block;color:#6d8582;margin-top:4px}.status{font-weight:700;text-align:right;white-space:nowrap}.green{color:#16845e}.orange{color:#b56b00}.red{color:#b82e38}.muted{color:#788b89}.admin{display:flex;gap:8px;align-items:center}.admin input{width:80px;text-align:center}.admin button{padding:10px}h2{font-size:18px;margin-top:22px}.empty{padding:25px;text-align:center;color:#607d7a}@media(max-width:440px){.controls{grid-template-columns:1fr}.entry{align-items:flex-start}.admin{flex-wrap:wrap;justify-content:flex-end}.admin input{width:70px}}
</style></head><body><header><h1>AWA TOUR</h1><small>Наличие мест • личный кабинет</small></header><main><div class="notice">Данные о наличии мест загружаются из общей базы AWA TOUR. Если мест не указано, наличие уточняется.</div><div class="tabs"><button id="agent">Просмотр агента</button><button id="admin" class="off">Демо админки</button></div><div class="controls"><select id="group"><option value="">Все категории</option></select><input id="search" placeholder="Поиск экскурсии" aria-label="Поиск экскурсии"><input id="date" type="date" aria-label="Дата"><select id="tour"><option value="">Все экскурсии на дату</option></select></div><div id="result"></div></main><script>
const tours=[{"id": 1, "name": "Evening Bangkok", "group": "Бангкок", "days": "daily"}, {"id": 2, "name": "Evening Bangkok No Mahanakhon", "group": "Бангкок", "days": "daily"}, {"id": 3, "name": "Sunset Bangkok", "group": "Бангкок", "days": "daily"}, {"id": 4, "name": "Classic Bangkok", "group": "Бангкок", "days": "2,5"}, {"id": 5, "name": "Top Bangkok", "group": "Бангкок", "days": "daily"}, {"id": 6, "name": "Bangkok 2 Day", "group": "Двухдневные", "days": "2,5"}, {"id": 7, "name": "Kwai Classic", "group": "Двухдневные", "days": "daily"}, {"id": 8, "name": "Above the Clouds 2.0", "group": "Двухдневные", "days": "1,4"}, {"id": 9, "name": "Stalker", "group": "Двухдневные", "days": "4,7"}, {"id": 10, "name": "Golden Triangle", "group": "Двухдневные", "days": "3"}, {"id": 11, "name": "5 Islands Snorkeling Tour", "group": "Морские", "days": "3,6"}, {"id": 12, "name": "Pattaya Bay Cruise", "group": "Морские", "days": "2,7"}, {"id": 13, "name": "Ko Talu Pink Island", "group": "Морские", "days": "2,7"}, {"id": 14, "name": "Thai Maldives", "group": "Морские", "days": "request"}, {"id": 15, "name": "Sea Fishing", "group": "Морские", "days": "1,5"}, {"id": 16, "name": "Ko Samet 1 Day", "group": "Морские", "days": "daily"}, {"id": 17, "name": "Ayuttaya 5 Temples", "group": "Авторские", "days": "1,3,6"}, {"id": 18, "name": "Evening Ayuttaya", "group": "Авторские", "days": "2,5"}, {"id": 19, "name": "Kids Adventure", "group": "Авторские", "days": "1,2,4,5,6,7"}, {"id": 20, "name": "Jungle Tour", "group": "Авторские", "days": "daily"}, {"id": 21, "name": "Lost World", "group": "Авторские", "days": "2,4,6"}, {"id": 22, "name": "Searching for Sapphires", "group": "Авторские", "days": "5,6,7"}, {"id": 23, "name": "Thai Express + Monkey River", "group": "Авторские", "days": "2,6"}, {"id": 24, "name": "Amazing Thai", "group": "Авторские", "days": "3,7"}, {"id": 25, "name": "Alpaka Park", "group": "Авторские", "days": "2,6"}, {"id": 26, "name": "Dragon Lair", "group": "Авторские", "days": "2,4,7"}, {"id": 27, "name": "Expedition Pathfinders", "group": "Авторские", "days": "1,3,5"}, {"id": 28, "name": "Secrets of Siam", "group": "Авторские", "days": "1,4"}, {"id": 29, "name": "Amphava", "group": "Авторские", "days": "4,6"}, {"id": 30, "name": "Land of Waterfalls Kao Yai", "group": "Авторские", "days": "2,4,7"}, {"id": 31, "name": "Instagram Tour", "group": "Авторские", "days": "1,5"}, {"id": 32, "name": "Happy Tour", "group": "Авторские", "days": "2,6"}, {"id": 33, "name": "Evening in Old Siam", "group": "Авторские", "days": "3,7"}, {"id": 34, "name": "Power of Life", "group": "Авторские", "days": "2"}, {"id": 35, "name": "Relax Tur", "group": "Авторские", "days": "daily"}, {"id": 36, "name": "5 Miracles", "group": "Авторские", "days": "3,5,7"}, {"id": 37, "name": "Khao Kheo Zoo", "group": "Популярные", "days": "daily"}, {"id": 38, "name": "Khao Kheo VIP", "group": "Популярные", "days": "daily"}, {"id": 39, "name": "Nong Nooch Standard", "group": "Популярные", "days": "daily"}, {"id": 40, "name": "Nong Nooch VIP", "group": "Популярные", "days": "daily"}, {"id": 41, "name": "Discovery 8 in 1", "group": "Популярные", "days": "daily"}, {"id": 42, "name": "Big Discovery", "group": "Популярные", "days": "daily"}, {"id": 43, "name": "Siri Discovery", "group": "Популярные", "days": "1,4"}, {"id": 44, "name": "Thai Safary", "group": "Популярные", "days": "daily"}, {"id": 45, "name": "Wat Yan + Karens + Elephant", "group": "Популярные", "days": "2,4,6"}, {"id": 46, "name": "Wat Yan + Karens + Ritual", "group": "Популярные", "days": "2,4,6"}, {"id": 47, "name": "Ritual", "group": "Популярные", "days": "daily"}, {"id": 48, "name": "Ajan Kob Ayuttaya", "group": "Сак Янт", "days": "request"}, {"id": 49, "name": "Ajan Dam Rayong", "group": "Сак Янт", "days": "request"}, {"id": 50, "name": "Ajan Chalee Pattaya", "group": "Сак Янт", "days": "request"}, {"id": 51, "name": "Sai Keow", "group": "Без гида", "days": "daily"}, {"id": 52, "name": "Had Nang Ram", "group": "Без гида", "days": "daily"}, {"id": 53, "name": "Family Zootour", "group": "Без гида", "days": "2,5"}, {"id": 54, "name": "Dream World", "group": "Без гида", "days": "daily"}, {"id": 55, "name": "Safary World", "group": "Без гида", "days": "3,5"}, {"id": 56, "name": "Fishing Lake", "group": "Без гида", "days": "daily"}, {"id": 57, "name": "Elephant Riding 30 Min", "group": "Без гида", "days": "daily"}, {"id": 58, "name": "Elephant Riding 60 Min", "group": "Без гида", "days": "daily"}, {"id": 59, "name": "Aquaverse Columbia", "group": "Без гида", "days": "1,2,4,5,6,7"}, {"id": 60, "name": "Ramayana", "group": "Без гида", "days": "1,2,4,5,6,7"}, {"id": 61, "name": "Crocodile Farm", "group": "Без гида", "days": "daily"}, {"id": 62, "name": "Sanctuary of Truth", "group": "Без гида", "days": "daily"}, {"id": 63, "name": "Tarzan Flight", "group": "Без гида", "days": "daily"}, {"id": 64, "name": "Baan Sukhawadee", "group": "Без гида", "days": "daily"}, {"id": 65, "name": "X-Show 69", "group": "Вечерние шоу", "days": "daily"}, {"id": 66, "name": "79 Show Kamasutra", "group": "Вечерние шоу", "days": "daily"}, {"id": 67, "name": "89 Show", "group": "Вечерние шоу", "days": "daily"}, {"id": 68, "name": "Big Eye", "group": "Вечерние шоу", "days": "daily"}, {"id": 69, "name": "Colloseum", "group": "Вечерние шоу", "days": "daily"}, {"id": 70, "name": "Alcazar", "group": "Вечерние шоу", "days": "daily"}, {"id": 71, "name": "Tiffany", "group": "Вечерние шоу", "days": "daily"}, {"id": 72, "name": "Thai Boxing", "group": "Вечерние шоу", "days": "daily"}];

const SUPABASE_URL = "https://qpedkmocoyyzwupdhklq.supabase.co";
const SUPABASE_KEY = "sb_publishable_TBTmPc5KpVIY-Gq1rRkESA_q5okLglk";
const $=id=>document.getElementById(id);
let sessionToken=null, userRole="agent", isAdmin=false, store={};
const now=new Date();
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
$("date").min=localDate(now);
let last=new Date(now);last.setDate(last.getDate()+29);
$("date").max=localDate(last);$("date").value=localDate(now);
const groups=[...new Set(tours.map(x=>x.group))];
groups.forEach(g=>$("group").add(new Option(g,g)));
async function api(path,opts={}){
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+sessionToken,"Content-Type":"application/json",...(opts.headers||{})}});
 if(!r.ok)throw Error((await r.text()).slice(0,400));
 return r.status===204?null:r.json();
}
async function refresh(){
 const date=$("date").value;
 const data=await api("availability?tour_date=eq."+encodeURIComponent(date)+"&select=tour_id,seats_available,is_cancelled");
 store={};
 data.forEach(x=>store[x.tour_id+"|"+date]=x.is_cancelled?"cancel":x.seats_available);
 render();
}
function populate(){
 let id=$("tour").value;$("tour").length=1;
 tours.filter(t=>!$("group").value||t.group===$("group").value).forEach(t=>$("tour").add(new Option(t.name,t.id)));
 $("tour").value=id;
}
function scheduled(t,day){
 if(t.days==="request")return true;
 let n=(new Date(day+"T12:00:00").getDay()+6)%7+1;
 return t.days==="daily"||t.days.split(",").includes(String(n));
}
function status(v){
 if(v===undefined||v===null)return ["Наличие уточняется","muted"];
 if(v==="cancel")return ["Отменена","red"];
 if(v===0)return ["Нет мест","red"];
 return [v+" мест",v<=5?"orange":"green"];
}
function render(){
 populate();
 let date=$("date").value,search=$("search").value.toLowerCase(),g=$("group").value,id=$("tour").value;
 let found=tours.filter(t=>(!g||t.group===g)&&(!id||String(t.id)===id)&&t.name.toLowerCase().includes(search)&&scheduled(t,date));
 $("result").innerHTML=`<h2>${found.length} программ на ${new Date(date+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}</h2>`+(found.length?"":'<div class="empty">На выбранную дату программ не найдено</div>')+found.map(t=>{
 let v=store[t.id+"|"+date],s=status(v);
 return `<div class="entry"><div><strong>${t.name}</strong><small>${t.group}${t.days==="request"?" • по запросу":""}</small></div>${isAdmin?`<div class="admin"><input type="number" min="0" placeholder="Мест" id="n${t.id}" value="${typeof v==="number"?v:""}"><button data-id="${t.id}" data-act="save">✓</button><button data-id="${t.id}" data-act="cancel" style="background:#a94045">×</button><button data-id="${t.id}" data-act="clear" style="background:#738b88">↺</button></div>`:`<span class="status ${s[1]}">${s[0]}</span>`}</div>`;
 }).join("");
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
  const id=Number(b.dataset.id),act=b.dataset.act;
  try{
   if(act==="clear")await api("availability?tour_id=eq."+id+"&tour_date=eq."+date,{method:"DELETE"});
   else{
    let seats=null,cancelled=act==="cancel";
    if(!cancelled){
     let raw=$("n"+id).value;
     if(raw===""||!Number.isInteger(Number(raw))||Number(raw)<0){alert("Введите целое число мест от 0");return;}
     seats=Number(raw);
    }
    await api("availability?on_conflict=tour_id,tour_date",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({tour_id:id,tour_date:date,seats_available:seats,is_cancelled:cancelled})});
   }
   await refresh();
  }catch(e){alert("Не удалось сохранить: "+e.message)}
 });
}
$("agent").onclick=()=>{isAdmin=false;$("agent").classList.remove("off");$("admin").classList.add("off");render()};
$("admin").onclick=()=>{if(!["admin","manager"].includes(userRole))return;isAdmin=true;$("admin").classList.remove("off");$("agent").classList.add("off");render()};
["group","search","tour"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",()=>{if(id==="group")$("tour").value="";render()}));
$("date").addEventListener("change",()=>refresh().catch(e=>alert(e.message)));
async function login(email,password){
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
 const data=await r.json();
 if(!r.ok)throw Error(data.error_description||data.msg||data.error||"Ошибка входа");
 sessionToken=data.access_token;
 const profile=await api("profiles?select=role&limit=1");
 if(!profile.length)throw Error("У пользователя пока нет роли. Обратись к администратору.");
 userRole=profile[0].role;
 $("admin").style.display=["admin","manager"].includes(userRole)?"":"none";
 document.getElementById("auth-panel").style.display="none";
 document.querySelector("main").style.display="";
 await refresh();
}
document.querySelector("main").style.display="none";
const auth=document.createElement("div");
auth.id="auth-panel";
auth.innerHTML=`<form id="login-form" style="max-width:380px;margin:45px auto;padding:24px;background:white;border-radius:14px"><h2>Вход для агентов AWA TOUR</h2><input id="login-email" type="email" placeholder="Email" required style="width:100%;margin:8px 0"><input id="login-password" type="password" placeholder="Пароль" required style="width:100%;margin:8px 0"><button type="submit" style="width:100%">Войти</button><p id="login-error" style="color:#b82e38"></p></form>`;
document.body.appendChild(auth);
document.getElementById("login-form").onsubmit=async e=>{
 e.preventDefault();
 const err=document.getElementById("login-error");err.textContent="";
 try{await login(document.getElementById("login-email").value,document.getElementById("login-password").value)}
 catch(ex){err.textContent=ex.message}
};
</script></body></html>
